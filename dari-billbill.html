<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dari Billbill</title>
<style>
  * { box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    background: linear-gradient(-45deg, #4f46e5, #7c3aed, #ec4899, #4f46e5);
    background-size: 400% 400%;
    animation: gradientMove 12s ease infinite;
    position: relative;
  }

  @keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .particle {
    position: absolute;
    bottom: -50px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    animation: floatUp linear infinite;
  }

  @keyframes floatUp {
    0%   { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
    10%  { opacity: 1; }
    100% { transform: translateY(-110vh) translateX(20px) rotate(360deg); opacity: 0; }
  }

  .card {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    padding: 45px 35px;
    border-radius: 18px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.25);
    text-align: center;
    max-width: 320px;
    position: relative;
    z-index: 2;
    opacity: 0;
    transform: translateY(30px) scale(0.95);
    animation: cardIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  @keyframes cardIn {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  h1 {
    font-size: 24px;
    margin-bottom: 24px;
    color: #1e1b4b;
    letter-spacing: 0.5px;
    background: linear-gradient(90deg, #4f46e5, #ec4899);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  a.button {
    display: inline-block;
    background: linear-gradient(90deg, #4f46e5, #7c3aed);
    color: white;
    text-decoration: none;
    padding: 14px 28px;
    border-radius: 10px;
    font-weight: bold;
    letter-spacing: 0.3px;
    animation: pulseGlow 2.2s ease-in-out infinite;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  a.button:hover {
    transform: translateY(-3px) scale(1.04);
    box-shadow: 0 8px 20px rgba(124, 58, 237, 0.5);
  }

  a.button:active {
    transform: translateY(0) scale(0.98);
  }

  @keyframes pulseGlow {
    0%   { box-shadow: 0 0 0 0 rgba(124, 58, 237, 0.5); }
    70%  { box-shadow: 0 0 0 14px rgba(124, 58, 237, 0); }
    100% { box-shadow: 0 0 0 0 rgba(124, 58, 237, 0); }
  }
</style>
</head>
<body>

  <div class="particle" style="left:10%; width:18px; height:18px; animation-duration:9s; animation-delay:0s;"></div>
  <div class="particle" style="left:25%; width:12px; height:12px; animation-duration:7s; animation-delay:1.5s;"></div>
  <div class="particle" style="left:40%; width:22px; height:22px; animation-duration:11s; animation-delay:3s;"></div>
  <div class="particle" style="left:55%; width:14px; height:14px; animation-duration:8s; animation-delay:0.5s;"></div>
  <div class="particle" style="left:70%; width:20px; height:20px; animation-duration:10s; animation-delay:2s;"></div>
  <div class="particle" style="left:85%; width:16px; height:16px; animation-duration:6.5s; animation-delay:1s;"></div>
  <div class="particle" style="left:95%; width:10px; height:10px; animation-duration:9.5s; animation-delay:2.5s;"></div>

  <div class="card">
    <h1>Dari Billbill</h1>
    <a class="button" href="https://bangbyll.github.io/Dari-Byll-untuk-repelitaa/kejutan_bunga_repelita.html" target="_blank">Kunjungi Website</a>
  </div>
</body>
</html>
